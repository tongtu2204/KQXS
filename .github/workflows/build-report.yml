name: Build LaTeX report

on:
  push:
    branches: [lotery-update]
    paths:
      - 'report/**'
      - 'artifacts/**'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile report with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
          latexmk_use_xelatex: true
          args: -pdfxe -interaction=nonstopmode -halt-on-error
      - name: Inspect PDF
        run: pdfinfo report/main.pdf | grep -E 'Pages|Page size|File size'
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: report/main.pdf
          if-no-files-found: error
